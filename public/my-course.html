<!DOCTYPE html>
<html>
<head>
  <title>My Enrolled Courses</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    #myCoursesList {
      max-width: 800px;
      margin: 20px auto;
    }

    .course-card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }

    .course-card:hover {
      transform: scale(1.01);
    }

    .course-card h3 {
      margin-top: 0;
      color: #4CAF50;
    }

    .course-card p {
      margin: 8px 0;
      color: #555;
    }

    .course-card strong {
      color: #333;
    }

    p.no-courses {
      text-align: center;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h2>My Enrolled Courses</h2>
  <div id="myCoursesList"></div>

  <script>
    async function fetchMyCourses() {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Please log in first.');
        window.location.href = 'login.html';
        return;
      }

      const res = await fetch('/api/courses/my-courses', {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });

      const data = await res.json();
      console.log("API Response:", data);

      if (!res.ok) {
        alert(data.message || 'Failed to fetch courses');
        return;
      }

      if (data.length === 0) {
        document.getElementById('myCoursesList').innerHTML = '<p class="no-courses">You are not enrolled in any courses.</p>';
        return;
      }

      let html = '';
      data.forEach(course => {
        html += `
          <div class="course-card">
            <h3>${course.title}</h3>
            <p>${course.description}</p>
            <p><strong>Instructor:</strong> ${course.instructor.name}</p>
            <p><strong>Price:</strong> $${course.price}</p>
          </div>
        `;
      });

      document.getElementById('myCoursesList').innerHTML = html;
    }

    fetchMyCourses();
  </script>
</body>
</html>
